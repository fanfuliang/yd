server:
  port: 8118
  tomcat:
    max-threads: 2000
    max-connections: 20000

spring:
  application:
    name: template
  datasource:
    url: jdbc:mysql://192.168.0.212:13306/lianying?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
    username: root
    password: yudao@123456
    driver-class-name: com.mysql.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
  session:
    store-type: redis
  redis:
    host: 192.168.0.212
    password:
    port: 6379

mybatis-plus:
  mapper-locations: classpath*:com/yudao/lianying/v1/*/dao/mapper/xml/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    call-setters-on-nulls: true

pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

eureka:
  client:
    fetch-registry: false #false 表示自己端就是注册中心,我的职责就是维护服务实例，并不需要去检索服务
    register-with-eureka: false #false 表示不向注册中心中注册自己